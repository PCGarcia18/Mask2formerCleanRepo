MODEL:
  BACKBONE:
    FREEZE_AT: 0
    NAME: "build_resnet_backbone"
  WEIGHTS: "detectron2://ImageNetPretrained/torchvision/R-50.pkl"
  PIXEL_MEAN: [91.488, 96.539, 89.642] 
  PIXEL_STD: [57.424, 55.494, 53.773] 
  RESNETS:
    DEPTH: 50 
    STEM_TYPE: "basic"  # not used
    STEM_OUT_CHANNELS: 64
    STRIDE_IN_1X1: False
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
    # NORM: "SyncBN"
    RES5_MULTI_GRID: [1, 1, 1]  # not used
DATASETS:
  TRAIN: ("landcoverAI_train",) # 7470 imgenes de entrenamiento
  TEST: ("landcoverAI_test",) 
SOLVER:
  IMS_PER_BATCH: 8
  BASE_LR: 0.0001 
  STEPS: (327778, 355092)
  MAX_ITER: 93375 # 100 epocas a 8 imgs/iter con 7470 imgs de entrenamiento
  WARMUP_FACTOR: 1.0
  WARMUP_ITERS: 10
  WEIGHT_DECAY: 0.05
  OPTIMIZER: "ADAMW"
  BACKBONE_MULTIPLIER: 0.1
  CHECKPOINT_PERIOD: 1000000
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.01
    NORM_TYPE: 2.0
  AMP:
    ENABLED: True
INPUT:
  IMAGE_SIZE: 1024 
  MIN_SCALE: 0.1
  MAX_SCALE: 2.0
  FORMAT: "RGB" 
  DATASET_MAPPER_NAME: "mask_former_semantic_RAWB"
  MAX_SIZE_TEST: 512 # los patches de LANDCOVERAI son 512*512
  MAX_SIZE_TRAIN: 512
  MIN_SIZE_TEST: 512
  MIN_SIZE_TRAIN:
  - 512
TEST: 
  EVAL_PERIOD: 9338
DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: True
  NUM_WORKERS: 4 
VERSION: 2
OUTPUT_DIR: ./output_LANDCOVERAI_first_complete_training_fapn_100_epochs
